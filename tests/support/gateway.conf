# Minimal stand-in for Supabase's Kong gateway, used only by the E2E stack.
# supabase-js builds its auth calls as `${SUPABASE_URL}/auth/v1/...`, but GoTrue
# serves those routes from the root, so the prefix has to be stripped.
server {
    listen 80;
    server_name _;

    location /auth/v1/ {
        proxy_pass http://test-auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
