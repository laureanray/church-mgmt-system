services:
  db:
    image: postgres:17-alpine
    container_name: church_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: church
      POSTGRES_PASSWORD: church
      POSTGRES_DB: church
    ports:
      - "5433:5432"
    volumes:
      - church_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U church -d church"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  church_pgdata:
