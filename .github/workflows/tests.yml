name: Tests
on:
  # Pull requests already cover every task branch. Without this filter a branch
  # push and its pull request run the suite twice on one commit, and the two
  # runs race for the same per-IP registry pull quota.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Jobs run on GitHub-hosted runners, which are free for public repositories.
# The AWS runners in infra/ are no longer routed to from here.
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s infra/shared-ci -p 'test_*.py'
      - run: bun run test:irm
      # A story that fails to compile is invisible to typecheck — Storybook
      # resolves them through its own Vite build, not tsc's project graph.
      - run: bun run build-storybook
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Lets the coverage step post/update its comment on the pull request.
      pull-requests: write
    env:
      # UTC, as on Vercel. Code that names the church's zone is unaffected;
      # code that leans on the process's zone should fail here, not in
      # production. Unit tests also run key cases in several zones
      # (tests/support/time-zones.ts), and the e2e browser is on Manila time.
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      # Each suite writes coverage/lcov.info; keep this one before the next
      # suite overwrites it. The report merges them.
      - name: Keep unit coverage
        if: always()
        run: if [ -f coverage/lcov.info ]; then mv coverage/lcov.info coverage/unit.lcov; fi
      # Needs neither Docker nor a database, so it runs ahead of the slow steps
      # and a broken component fails the job in seconds rather than minutes.
      - run: bun run test:ui
      - name: Start test database
        # Anonymous image pulls share a per-IP quota with every other runner, so
        # `toomanyrequests: Rate exceeded` is a transient registry response
        # rather than a broken compose file. Back off and try again.
        run: |
          for attempt in 1 2 3; do
            if bun run test:db:up; then exit 0; fi
            echo "::warning::test:db:up failed (attempt $attempt/3); retrying"
            bun run test:db:down || true
            sleep $((attempt * 30))
          done
          exit 1
      # With coverage: database code — services, queries, the auth checks — is
      # only reachable here, so the unit suite alone reports it as untested.
      - run: bun run test:integration:coverage
      - name: Keep integration coverage
        if: always()
        run: if [ -f coverage/lcov.info ]; then mv coverage/lcov.info coverage/integration.lcov; fi
      # `always()`, so a failing suite above still gets its coverage comment —
      # the report says which suite's data is missing.
      - name: Build coverage report
        if: always()
        run: |
          bun scripts/coverage-report.mjs > coverage/report.md
          cat coverage/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment coverage on pull request
        # Fork pull requests get a read-only token, so skip rather than fail the
        # job.
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- coverage-report -->'
            const body = `${marker}\n${fs.readFileSync('coverage/report.md', 'utf8')}`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            )
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 7
      - run: bun run test:db:down
        if: always()
