name: Tests
on:
  # Pull requests already cover every task branch. Without this filter a branch
  # push and its pull request run the suite twice on one commit, and the two
  # runs race for the same per-IP registry pull quota.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Jobs run on GitHub-hosted runners until the repository variable
# AWS_CODEBUILD_PROJECT names a deployed CodeBuild project; then each job runs
# in its own ephemeral CodeBuild container. The trailing `job-*` label keeps
# every job's runner request distinct. See infra/github-runner/README.md.
jobs:
  quality:
    runs-on: ${{ vars.AWS_CODEBUILD_PROJECT != '' && format('codebuild-{0}-{1}-{2} job-quality', vars.AWS_CODEBUILD_PROJECT, github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun run test:irm
      # A story that fails to compile is invisible to typecheck — Storybook
      # resolves them through its own Vite build, not tsc's project graph.
      - run: bun run build-storybook
  tests:
    runs-on: ${{ vars.AWS_CODEBUILD_PROJECT != '' && format('codebuild-{0}-{1}-{2} job-tests', vars.AWS_CODEBUILD_PROJECT, github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      # Lets the coverage step post/update its comment on the pull request.
      pull-requests: write
    env:
      TZ: Asia/Manila
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - name: Build coverage report
        run: |
          bun scripts/coverage-report.mjs > coverage/report.md
          cat coverage/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment coverage on pull request
        # Fork pull requests get a read-only token, so skip rather than fail the
        # job. github-script instead of the gh CLI: GitHub-hosted images ship
        # gh, the CodeBuild image does not.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- coverage-report -->'
            const body = `${marker}\n${fs.readFileSync('coverage/report.md', 'utf8')}`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            )
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
      # Needs neither Docker nor a database, so it runs ahead of the slow steps
      # and a broken component fails the job in seconds rather than minutes. It
      # stays below the coverage comment, which must land before anything else
      # can fail the job.
      - run: bun run test:ui
      - name: Start test database
        # Anonymous image pulls share a per-IP quota with every other runner, so
        # `toomanyrequests: Rate exceeded` is a transient registry response
        # rather than a broken compose file. Back off and try again.
        run: |
          for attempt in 1 2 3; do
            if bun run test:db:up; then exit 0; fi
            echo "::warning::test:db:up failed (attempt $attempt/3); retrying"
            bun run test:db:down || true
            sleep $((attempt * 30))
          done
          exit 1
      - run: bun run test:integration
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 7
      - run: bun run test:db:down
        if: always()
