name: Tests
on:
  # Pull requests already cover every task branch. Without this filter a branch
  # push and its pull request run the suite twice on one commit, and the two
  # runs race for the same per-IP registry pull quota.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Lets the coverage step post/update its comment on the pull request.
      pull-requests: write
    env:
      TZ: Asia/Manila
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - name: Build coverage report
        run: |
          bun scripts/coverage-report.mjs > coverage/report.md
          cat coverage/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment coverage on pull request
        # Fork pull requests get a read-only token, so skip rather than fail the job.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file coverage/report.md --edit-last --create-if-none
      - name: Start test database
        # Anonymous image pulls share a per-IP quota with every other runner, so
        # `toomanyrequests: Rate exceeded` is a transient registry response
        # rather than a broken compose file. Back off and try again.
        run: |
          for attempt in 1 2 3; do
            if bun run test:db:up; then exit 0; fi
            echo "::warning::test:db:up failed (attempt $attempt/3); retrying"
            bun run test:db:down || true
            sleep $((attempt * 30))
          done
          exit 1
      - run: bun run test:integration
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 7
      - run: bun run test:db:down
        if: always()
